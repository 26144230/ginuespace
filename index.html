<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenSpace - 몰입 & 타이머 대시보드</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js (3D 배경용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Tone.js (음향 생성용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      overflow-x: hidden;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .glass-card-dark {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col relative selection:bg-indigo-500 selection:text-white">

  <!-- 3D Canvas Background -->
  <div id="canvas-container"></div>

  <!-- Header -->
  <header class="w-full px-6 py-4 flex justify-between items-center z-10 border-b border-white/10 glass-card-dark">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-indigo-600/30 rounded-xl border border-indigo-400/30">
        <i data-lucide="sparkles" class="w-6 h-6 text-indigo-400"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">ZenSpace</h1>
        <p class="text-xs text-slate-400">나만의 몰입 & 리프레시 공간</p>
      </div>
    </div>

    <!-- Theme Control -->
    <div class="flex items-center space-x-2">
      <span class="text-xs text-slate-400 mr-1 hidden sm:inline">테마 시각효과:</span>
      <button onclick="changeTheme('nebula')" class="px-3 py-1.5 text-xs rounded-lg glass-card hover:bg-white/20 transition">네뷸라</button>
      <button onclick="changeTheme('emerald')" class="px-3 py-1.5 text-xs rounded-lg glass-card hover:bg-white/20 transition">에메랄드</button>
      <button onclick="changeTheme('sunset')" class="px-3 py-1.5 text-xs rounded-lg glass-card hover:bg-white/20 transition">선셋</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 z-10">

    <!-- Left Column: Timer & Ambience (7 cols) -->
    <section class="lg:col-span-7 flex flex-col gap-6">

      <!-- Pomodoro Timer -->
      <div class="glass-card-dark rounded-3xl p-6 sm:p-8 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl">
        
        <!-- Timer Modes -->
        <div class="flex bg-slate-800/60 p-1.5 rounded-2xl mb-8 border border-white/10">
          <button id="mode-focus" onclick="setMode('focus')" class="px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-300 bg-indigo-600 text-white shadow-lg">집중 (25m)</button>
          <button id="mode-short" onclick="setMode('short')" class="px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-300 text-slate-400 hover:text-white">휴식 (5m)</button>
          <button id="mode-long" onclick="setMode('long')" class="px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-300 text-slate-400 hover:text-white">긴 휴식 (15m)</button>
        </div>

        <!-- Circular Timer Visualizer -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center mb-8">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4" class="text-slate-800" fill="transparent" />
            <circle id="timer-progress" cx="50" cy="50" r="44" stroke="currentColor" stroke-width="4" 
                    class="text-indigo-500 transition-all duration-500 stroke-round" 
                    fill="transparent" 
                    stroke-dasharray="276.46" 
                    stroke-dashoffset="0" />
          </svg>
          <div class="absolute flex flex-col items-center">
            <span id="timer-display" class="text-5xl sm:text-6xl font-bold tracking-tighter text-white">25:00</span>
            <span id="timer-label" class="text-xs uppercase tracking-widest text-indigo-300 font-semibold mt-2">Focus Time</span>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center space-x-4">
          <button id="start-btn" onclick="toggleTimer()" class="w-14 h-14 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white flex items-center justify-center transition shadow-lg shadow-indigo-600/30">
            <i data-lucide="play" id="play-icon" class="w-6 h-6 fill-current"></i>
          </button>
          <button onclick="resetTimer()" class="w-12 h-12 rounded-2xl glass-card hover:bg-white/20 active:scale-95 text-slate-300 flex items-center justify-center transition">
            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Ambience Sound Engine -->
      <div class="glass-card-dark rounded-3xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center space-x-2">
            <i data-lucide="volume-2" class="w-5 h-5 text-indigo-400"></i>
            <h2 class="font-semibold text-white">생성형 앰비언트 사운드</h2>
          </div>
          <span class="text-xs text-slate-400">Tone.js 오디오 오실레이터</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <!-- Rain Sound -->
          <div class="bg-slate-800/40 border border-white/5 p-4 rounded-2xl flex flex-col justify-between">
            <div class="flex justify-between items-center mb-3">
              <span class="text-sm font-medium text-slate-200">빗소리 (Rain)</span>
              <button id="btn-rain" onclick="toggleSound('rain')" class="p-2 rounded-xl bg-slate-700/50 hover:bg-indigo-600/50 text-slate-300 transition">
                <i data-lucide="cloud-rain" class="w-4 h-4"></i>
              </button>
            </div>
            <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('rain', this.value)" class="w-full accent-indigo-500 bg-slate-700 rounded-lg h-1.5 cursor-pointer">
          </div>

          <!-- Sea Waves -->
          <div class="bg-slate-800/40 border border-white/5 p-4 rounded-2xl flex flex-col justify-between">
            <div class="flex justify-between items-center mb-3">
              <span class="text-sm font-medium text-slate-200">파도소리 (Waves)</span>
              <button id="btn-waves" onclick="toggleSound('waves')" class="p-2 rounded-xl bg-slate-700/50 hover:bg-indigo-600/50 text-slate-300 transition">
                <i data-lucide="waves" class="w-4 h-4"></i>
              </button>
            </div>
            <input type="range" id="vol-waves" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('waves', this.value)" class="w-full accent-indigo-500 bg-slate-700 rounded-lg h-1.5 cursor-pointer">
          </div>

          <!-- Deep Drone -->
          <div class="bg-slate-800/40 border border-white/5 p-4 rounded-2xl flex flex-col justify-between">
            <div class="flex justify-between items-center mb-3">
              <span class="text-sm font-medium text-slate-200">명상 음향 (Drone)</span>
              <button id="btn-drone" onclick="toggleSound('drone')" class="p-2 rounded-xl bg-slate-700/50 hover:bg-indigo-600/50 text-slate-300 transition">
                <i data-lucide="disc" class="w-4 h-4"></i>
              </button>
            </div>
            <input type="range" id="vol-drone" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('drone', this.value)" class="w-full accent-indigo-500 bg-slate-700 rounded-lg h-1.5 cursor-pointer">
          </div>
        </div>
      </div>

    </section>

    <!-- Right Column: Tasks & Quotes (5 cols) -->
    <section class="lg:col-span-5 flex flex-col gap-6">

      <!-- Today's Quote -->
      <div class="glass-card-dark rounded-3xl p-6 shadow-2xl relative overflow-hidden">
        <div class="flex items-center space-x-2 text-indigo-400 mb-2">
          <i data-lucide="quote" class="w-4 h-4"></i>
          <span class="text-xs uppercase font-semibold tracking-wider">오늘의 한 줄</span>
        </div>
        <p id="quote-text" class="text-sm sm:text-base text-slate-200 font-light italic leading-relaxed">
          "천 리 길도 한 걸음부터 시작된다."
        </p>
        <p id="quote-author" class="text-xs text-indigo-300 text-right mt-3 font-medium">- 노자</p>
      </div>

      <!-- Task Manager -->
      <div class="glass-card-dark rounded-3xl p-6 shadow-2xl flex-1 flex flex-col min-h-[350px]">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center space-x-2">
            <i data-lucide="check-square" class="w-5 h-5 text-indigo-400"></i>
            <h2 class="font-semibold text-white">오늘의 목표</h2>
          </div>
          <span id="task-count" class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-500/30">0개 완료</span>
        </div>

        <!-- Task Input -->
        <form onsubmit="addTask(event)" class="flex gap-2 mb-4">
          <input type="text" id="task-input" placeholder="새로운 할 일을 입력하세요..." required
                 class="flex-1 bg-slate-800/60 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl transition flex items-center justify-center">
            <i data-lucide="plus" class="w-5 h-5"></i>
          </button>
        </form>

        <!-- Task List -->
        <div id="task-list" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[280px]">
          <!-- Dynamic Task Items Will Render Here -->
        </div>
      </div>

    </section>
  </main>

  <!-- Script implementation -->
  <script>
    // --- 1. Lucide Icons Initializer ---
    lucide.createIcons();

    // --- 2. Three.js Background Canvas Setup ---
    let scene, camera, renderer, particleSystem;
    let particlesCount = 700;
    let themeColors = {
      nebula: 0x6366f1, // Indigo
      emerald: 0x10b981, // Emerald
      sunset: 0xf43f5e   // Rose
    };

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Create Particle Geometry
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particlesCount * 3);
      const scales = new Float32Array(particlesCount);

      for (let i = 0; i < particlesCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 15;
        positions[i + 1] = (Math.random() - 0.5) * 15;
        positions[i + 2] = (Math.random() - 0.5) * 15;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      // Particle Material
      const material = new THREE.PointsMaterial({
        color: themeColors.nebula,
        size: 0.05,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });

      particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      // Mouse Interaction
      document.addEventListener('mousemove', (e) => {
        const mouseX = (e.clientX / window.innerWidth) - 0.5;
        const mouseY = (e.clientY / window.innerHeight) - 0.5;
        particleSystem.rotation.x = mouseY * 0.5;
        particleSystem.rotation.y = mouseX * 0.5;
      });

      animate3D();
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      particleSystem.rotation.y += 0.001;
      particleSystem.rotation.x += 0.0005;
      renderer.render(scene, camera);
    }

    function changeTheme(themeName) {
      if (particleSystem && themeColors[themeName]) {
        particleSystem.material.color.setHex(themeColors[themeName]);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init3D();

    // --- 3. Pomodoro Timer Logic ---
    const timerModes = {
      focus: { name: "Focus Time", time: 25 * 60 },
      short: { name: "Short Break", time: 5 * 60 },
      long: { name: "Long Break", time: 15 * 60 }
    };

    let currentMode = 'focus';
    let timeLeft = timerModes.focus.time;
    let totalTime = timerModes.focus.time;
    let timerInterval = null;
    let isRunning = false;

    const display = document.getElementById('timer-display');
    const label = document.getElementById('timer-label');
    const progressCircle = document.getElementById('timer-progress');
    const playIcon = document.getElementById('play-icon');
    const circumference = 2 * Math.PI * 44; // r = 44

    function setMode(mode) {
      currentMode = mode;
      totalTime = timerModes[mode].time;
      timeLeft = totalTime;
      label.innerText = timerModes[mode].name;

      // Update UI active tab button styling
      ['focus', 'short', 'long'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = "px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-300 bg-indigo-600 text-white shadow-lg";
        } else {
          btn.className = "px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-300 text-slate-400 hover:text-white";
        }
      });

      resetTimer();
    }

    function updateTimerUI() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      
      // Update SVG Progress
      const offset = circumference - (timeLeft / totalTime) * circumference;
      progressCircle.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        playIcon.setAttribute('data-lucide', 'play');
      } else {
        isRunning = true;
        playIcon.setAttribute('data-lucide', 'pause');
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerUI();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            playIcon.setAttribute('data-lucide', 'play');
            alert("시간이 완료되었습니다!");
          }
        }, 1000);
      }
      lucide.createIcons();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeLeft = totalTime;
      playIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();
      updateTimerUI();
    }

    // --- 4. Generative Audio Engine (Tone.js) ---
    let sounds = {
      rain: { active: false, node: null, volume: null },
      waves: { active: false, node: null, volume: null },
      drone: { active: false, node: null, volume: null }
    };

    async function initAudio() {
      await Tone.start();
    }

    function toggleSound(type) {
      initAudio();
      
      const btn = document.getElementById(`btn-${type}`);

      if (!sounds[type].active) {
        sounds[type].active = true;
        btn.classList.add('bg-indigo-600', 'text-white');

        if (type === 'rain') {
          // Rain Simulation using Pink Noise + Filter
          const noise = new Tone.Noise("pink").start();
          const filter = new Tone.Filter(1000, "lowpass").toDestination();
          const vol = new Tone.Volume(-12).connect(filter);
          noise.connect(vol);
          sounds.rain.node = noise;
          sounds.rain.volume = vol;
        } else if (type === 'waves') {
          // Waves Simulation using LFO + Filter + White Noise
          const noise = new Tone.Noise("white").start();
          const filter = new Tone.Filter(400, "lowpass").toDestination();
          const lfo = new Tone.LFO(0.2, 200, 800).start();
          lfo.connect(filter.frequency);
          const vol = new Tone.Volume(-10).connect(filter);
          noise.connect(vol);
          sounds.waves.node = noise;
          sounds.waves.volume = vol;
        } else if (type === 'drone') {
          // Meditative Ambient Synth Tone
          const synth = new Tone.OmniOscillator(110, "sine").start();
          const vol = new Tone.Volume(-15).toDestination();
          synth.connect(vol);
          sounds.drone.node = synth;
          sounds.drone.volume = vol;
        }
      } else {
        sounds[type].active = false;
        btn.classList.remove('bg-indigo-600', 'text-white');
        if (sounds[type].node) {
          sounds[type].node.stop();
          sounds[type].node.dispose();
          sounds[type].node = null;
        }
      }
    }

    function setVolume(type, val) {
      if (sounds[type].volume) {
        // Convert 0..1 linear scale to Decibels (-40dB to 0dB)
        const db = Tone.gainToDb(parseFloat(val));
        sounds[type].volume.volume.value = db;
      }
    }

    // --- 5. Task List LocalStorage Manager ---
    let tasks = JSON.parse(localStorage.getItem('zenspace_tasks')) || [
      { id: 1, text: '25분 몰입 세션 완료하기', completed: false },
      { id: 2, text: '따뜻한 차 한 잔 마시기', completed: true }
    ];

    function saveAndRenderTasks() {
      localStorage.setItem('zenspace_tasks', JSON.stringify(tasks));
      const container = document.getElementById('task-list');
      container.innerHTML = '';

      let completedCount = 0;

      tasks.forEach(task => {
        if (task.completed) completedCount++;

        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-3 rounded-xl border transition ${
          task.completed ? 'bg-slate-800/20 border-white/5 opacity-60' : 'bg-slate-800/50 border-white/10 hover:border-indigo-500/30'
        }`;

        item.innerHTML = `
          <div class="flex items-center space-x-3 cursor-pointer" onclick="toggleTask(${task.id})">
            <div class="w-5 h-5 rounded-lg border flex items-center justify-center transition ${
              task.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-500'
            }">
              ${task.completed ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
            </div>
            <span class="text-sm ${task.completed ? 'line-through text-slate-400' : 'text-slate-200'}">${task.text}</span>
          </div>
          <button onclick="deleteTask(${task.id})" class="text-slate-500 hover:text-rose-400 p-1 transition">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        `;
        container.appendChild(item);
      });

      document.getElementById('task-count').innerText = `${completedCount}/${tasks.length} 완료`;
      lucide.createIcons();
    }

    function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ id: Date.now(), text, completed: false });
      input.value = '';
      saveAndRenderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveAndRenderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveAndRenderTasks();
    }

    // --- 6. Quotes Random Generator ---
    const quotes = [
      { text: "천 리 길도 한 걸음부터 시작된다.", author: "노자" },
      { text: "작은 일에 충실한 것이 위대한 일로 가는 발판이다.", author: "에디슨" },
      { text: "오늘 할 수 있는 일에 온 힘을 다하라.", author: "괴테" },
      { text: "집중력은 성공의 핵심 열쇠이다.", author: "빌 게이츠" }
    ];

    function setRandomQuote() {
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('quote-text').innerText = `"${q.text}"`;
      document.getElementById('quote-author').innerText = `- ${q.author}`;
    }

    // Initial Execution
    updateTimerUI();
    saveAndRenderTasks();
    setRandomQuote();
  </script>
</body>
</html>
